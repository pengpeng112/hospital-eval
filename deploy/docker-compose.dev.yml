name: hospital-eval-dev
services:
  eval-postgres:
    image: postgres:15
    container_name: eval-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${EVAL_PG_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../docs/sql_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
  eval-server:
    build: ../hospital-eval-server
    container_name: eval-server
    env_file: .env
    environment:
      EVAL_PG_HOST: eval-postgres
      EVAL_PG_INNER_PORT: "5432"
      EVAL_UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:${EVAL_API_PORT}:48080"
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      eval-postgres: { condition: service_healthy }
  eval-kkfileview:
    image: keking/kkfileview:latest
    container_name: eval-kkfileview
    restart: unless-stopped
    environment:
      KK_TRUST_HOST: "*"
    ports:
      - "127.0.0.1:${EVAL_KKFILE_PORT}:8012"
