name: hospital-eval-dev
services:
  eval-postgres:
    image: postgres:15
    container_name: eval-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${EVAL_PG_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../docs/sql_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
  # TASK-04：kkFileView 镜像不可用（4.4.0 标签在 docker.io 不存在；latest 拉取 30 分钟无进展，
  # 当前网络环境下不可用），按任务书规则注释停用，其余步骤照常。
  # 网络恢复后手动执行 `docker pull keking/kkfileview:latest`，再取消下方注释并
  # `docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env up -d eval-kkfileview`。
