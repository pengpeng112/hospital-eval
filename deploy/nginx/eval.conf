server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 110m;

    # 前端 SPA（Vue 3 history 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://eval-server:48080;
        proxy_read_timeout 600s;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # kkFileView 预览（latest 版不支持 KK_CONTEXT_PATH → 代理去前缀，回退方案见部署记录）
    location /kkview/ {
        proxy_pass http://eval-kkfileview:8012/;
    }
}
